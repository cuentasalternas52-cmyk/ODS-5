<head>
     <link rel="icon" href="imagenes/logo.jpg" type="image/png">
</head>



<div class="container">
  <h2>Mi Perfil 👤</h2>

  <p><strong>Usuario:</strong> <span id="usuario">Cargando...</span></p>
  <p><strong>Nombre:</strong> <span id="nombre">Cargando...</span></p>
  <p><strong>Correo:</strong> <span id="correo">Cargando...</span></p><br><br

  <button class="btn-cerrar" onclick="cerrarSesion()">Cerrar sesión</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const token = localStorage.getItem("token");

  // 🔒 Validar sesión
  if (!token) {
    alert("Debes iniciar sesión");
    window.location.href = "login.html";
    return;
  }

  // 🔄 Cargar perfil desde Render
  async function cargarPerfil() {
    try {
      const res = await fetch("https://ods-5-1.onrender.com/perfil", {
        headers: {
          "Authorization": "Bearer " + token
        }
      });

      if (!res.ok) {
        throw new Error("No autorizado");
      }

      const data = await res.json();

     document.getElementById("usuario").textContent = data.usuario;
     document.getElementById("nombre").textContent = data.nombre;
     document.getElementById("correo").textContent = data.correo;
    } catch (err) {
      console.error(err);
      alert("Sesión expirada o error. Inicia sesión nuevamente.");
      localStorage.removeItem("token");
      window.location.href = "login.html";
    }
  }

  cargarPerfil();

});



function cerrarSesion() {
  localStorage.removeItem("token");

  document.body.style.opacity = "0.5";

  setTimeout(() => {
    window.location.href = "login.html";
  }, 500);
}
</script>
