<head>
  <link rel="icon" href="imagenes/logo.jpg" type="image/png">

  <!-- 🔒 evitar cache (IMPORTANTE) -->
  <meta http-equiv="Cache-Control" content="no-store" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
</head>

<div class="container">
  <h2>Mi Perfil 👤</h2><br><br>

  <p><strong>Usuario:</strong> <span id="usuario">Cargando...</span></p>
  <p><strong>Nombre:</strong> <span id="nombre">Cargando...</span></p>
  <p><strong>Correo:</strong> <span id="correo">Cargando...</span></p>

  <button class="btn-cerrar" onclick="cerrarSesion()">Cerrar sesión</button>
</div>

<script>
  // 🔒 PROTECCIÓN INMEDIATA (ANTI BACK)
  const token = localStorage.getItem("token");

  if (!token) {
    window.location.replace("login.html");
  }

  // 🔄 CARGAR PERFIL
  async function cargarPerfil() {
    try {
      const res = await fetch("https://ods-5-1.onrender.com/perfil", {
        headers: {
          "Authorization": "Bearer " + token
        }
      });

      const data = await res.json();
      console.log("RESPUESTA PERFIL:", data);

      if (!res.ok) {
        throw new Error("Error en perfil");
      }

      document.getElementById("usuario").textContent = data.usuario;
      document.getElementById("nombre").textContent = data.nombre;
      document.getElementById("correo").textContent = data.correo;

    } catch (err) {
      console.error(err);
      localStorage.removeItem("token");
      window.location.replace("login.html");
    }
  }

  cargarPerfil();

  // 🚪 CERRAR SESIÓN
  function cerrarSesion() {
    localStorage.removeItem("token");
    window.location.replace("login.html");
  }
</script>
