<div class="container">
  <h2>Mi Perfil 👤</h2>

  <p><strong>Usuario:</strong> <span id="usuario">Cargando...</span></p>
  <p><strong>Nombre:</strong> <span id="nombre">Cargando...</span></p>
  <p><strong>Correo:</strong> <span id="correo">Cargando...</span></p>

  <button onclick="cerrarSesion()">Cerrar sesión</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const token = localStorage.getItem("token");

  // 🔒 Validar sesión
  if (!token) {
    alert("Debes iniciar sesión");
    window.location.href = "login.html";
    return;
  }

  // 🔄 Cargar perfil
  async function cargarPerfil() {
    try {
      const res = await fetch("/api/perfil", {
        headers: {
          "Authorization": "Bearer " + token
        }
      });

      if (!res.ok) {
        throw new Error("No autorizado");
      }

      let data;
      try {
        data = await res.json();
      } catch {
        throw new Error("Respuesta inválida");
      }

      // ✅ Mostrar datos
      document.getElementById("usuario").textContent = data.usuario || "—";
      document.getElementById("nombre").textContent = data.nombre || "—";
      document.getElementById("correo").textContent = data.correo || "—";

    } catch (err) {
      console.error(err);

      alert("Sesión expirada o error. Inicia nuevamente.");

      localStorage.removeItem("token");
      window.location.href = "login.html";
    }
  }

  cargarPerfil();

});

// 🚪 Logout
function cerrarSesion() {
  localStorage.removeItem("token");
  window.location.href = "login.html";
}
</script>
