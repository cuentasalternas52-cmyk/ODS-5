<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login - VozSegura</title>
<link rel="stylesheet" href="estilo.css">
<link rel="icon" href="imagenes/logo.jpg" type="image/png">
</head>

<body class="auth">

<div class="container">

    <!-- FORMULARIO -->
    <div class="form-box">
        <div class="logo">VozSegura</div>
        <div id="mensaje"></div>
        
        <h2>Iniciar sesión</h2>
        <p>Accede para recibir apoyo y protección</p>

        <form id="loginForm">
          <input type="text" id="usuario" placeholder="Usuario" required>
          <input type="password" id="password" placeholder="Contraseña" required>

          <button type="submit" class="btn primary">Entrar</button>
       </form>

        <p class="link">
            ¿No tienes cuenta? <a href="registro.html">Regístrate</a>
        </p>
    </div>

    <!-- IMAGEN -->
    <div class="image">
        <img src="imagenes/ilustracion-VozSegura.png" alt="Ilustración">
    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const form = document.getElementById("loginForm");
    const mensaje = document.getElementById("mensaje");

    form.addEventListener("submit", async function(e) {
        e.preventDefault();

        const usuario = document.getElementById("usuario").value.trim();
        const password = document.getElementById("password").value.trim();
        const btn = form.querySelector("button");

        // 🔒 Validación básica
        if (!usuario || !password) {
            mensaje.innerHTML = "<p style='color:red'>Completa todos los campos</p>";
            return;
        }


        // 🔄 Estado de carga
        btn.disabled = true;
        btn.innerText = "Cargando...";

        try {
            const res = await fetch("https://ods-5-1.onrender.com/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ usuario, password })
            });

            let data;
            try {
                data = await res.json();
            } catch {
                throw new Error("Respuesta inválida del servidor");
            }

            if (!res.ok) {
                mensaje.innerHTML = `<p style="color:red">${data.error || "Error en login"}</p>`;
                btn.disabled = false;
                btn.innerText = "Entrar";
                return;
            }

            // 💾 Guardar token
            localStorage.setItem("token", data.token);

            // 🚀 Redirigir
            window.location.href = "dashboard.html";

        } catch (error) {
            console.error(error);
            mensaje.innerHTML = "<p style='color:red'>Error en el servidor</p>";
            btn.disabled = false;
            btn.innerText = "Entrar";
        }
    });

});
</script>

</body>
</html>
