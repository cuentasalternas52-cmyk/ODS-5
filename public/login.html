<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login - VozSegura</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body class="auth">

<div class="container">

    <!-- FORMULARIO -->
    <div class="form-box">
        <div class="logo">VozSegura</div>
        <div id="mensaje"></div>
        
        <h2>Iniciar sesión</h2>
        <p>Accede para recibir apoyo y protección</p>

        <form id="loginForm">
          <input type="text" id="usuario" placeholder="Usuario" required>
          <input type="password" id="password" placeholder="Contraseña" required>

         <button type="submit" class="btn primary">Entrar</button>
       </form>

        <p class="link">
            ¿No tienes cuenta? <a href="registro.html">Regístrate</a>
        </p>
    </div>

    <!-- IMAGEN -->
    <div class="image">
        <img src="imagenes/ilustracion-VozSegura.png" alt="Ilustración">
    </div>

</div>


<script>
document.addEventListener("DOMContentLoaded", () => {

    const form = document.getElementById("loginForm");

    if (!form) {
        console.log("No se encontró el formulario");
        return;
    }

    form.addEventListener("submit", async function(e) {
        e.preventDefault();

        const usuario = document.getElementById("usuario").value;
        const password = document.getElementById("password").value;

        try {
            const res = await fetch("http://localhost:3000/api/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ usuario, password })
            });

            const data = await res.json();

            if (!res.ok) {
                document.getElementById("mensaje").innerText = data.error;
                return;
            }

            localStorage.setItem("token", data.token);
            window.location.href = "dashboard.html";

        } catch (error) {
            console.error(error);
            document.getElementById("mensaje").innerText = "Error en servidor";
        }
    });

});
</script>
</body>
</html>
