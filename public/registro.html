<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro - VozSegura</title>
<link rel="stylesheet" href="estilo.css">
<link rel="icon" href="imagenes/logo.jpg" type="image/png">
</head>

<body class="auth">

<div class="container">

    <div class="form-box">
        <div class="logo">VozSegura</div>

        <h2>Crear cuenta</h2>
        <p>Tu voz importa. Estamos contigo 💜</p>

        <form id="registroForm">
            <input type="text" id="usuario" placeholder="Usuario" required>
            <input type="text" id="nombre" placeholder="Nombre completo" required>
            <input type="email" id="correo" placeholder="Correo electrónico" required>
            <input type="password" id="password" placeholder="Contraseña" required>

            <button type="submit" class="btn primary">Registrarse</button>
        </form>

        <p id="mensajeError" class="error"></p>

        <p class="link">
            ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
        </p>
    </div>

    <div class="image">
        <img src="imagenes/ilustracion-VozSegura.png" alt="Ilustración de apoyo">
    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const form = document.getElementById("registroForm");
    const mensaje = document.getElementById("mensajeError");

    form.addEventListener("submit", async function(e) {
        e.preventDefault();

        const usuario = document.getElementById("usuario").value.trim();
        const nombre = document.getElementById("nombre").value.trim();
        const correo = document.getElementById("correo").value.trim();
        const password = document.getElementById("password").value.trim();
        const btn = form.querySelector("button");

        // 🔒 Validación básica
        if (!usuario || !nombre || !correo || !password) {
            mensaje.innerHTML = "<p style='color:red'>Completa todos los campos</p>";
            return;
        }

        if (password.length < 6) {
            mensaje.innerHTML = "<p style='color:red'>La contraseña debe tener al menos 6 caracteres</p>";
            return;
        }

        // 🔄 Estado de carga
        btn.disabled = true;
        btn.innerText = "Registrando...";

        try {
            const res = await fetch("/api/registro", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ usuario, nombre, correo, password })
            });

            let data;
            try {
                data = await res.json();
            } catch {
                throw new Error("Respuesta inválida del servidor");
            }

            if (!res.ok) {
                mensaje.innerHTML = `<p style="color:red">${data.error || "Error al registrar"}</p>`;
                btn.disabled = false;
                btn.innerText = "Registrarse";
                return;
            }

            // ✅ Registro exitoso
            alert("Usuario registrado correctamente");

            // 🚀 Redirigir
            window.location.href = "login.html";

        } catch (error) {
            console.error(error);
            mensaje.innerHTML = "<p style='color:red'>Error en el servidor</p>";
            btn.disabled = false;
            btn.innerText = "Registrarse";
        }
    });

});
</script>

</body>
</html>
