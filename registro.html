<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro - VozSegura</title>
<link rel="stylesheet" href="estilo.css">
</head>

<body class="auth">

<div class="container">

    <div class="form-box">
        <div class="logo">VozSegura</div>

        <h2>Crear cuenta</h2>
        <p>Tu voz importa. Estamos contigo 💜</p>

        <form action="php/registro.php" method="POST">
            <input type="text" name="usuario" placeholder="Usuario" required>
            <input type="text" name="nombre" placeholder="Nombre completo" required>
            <input type="email" name="correo" placeholder="Correo electrónico" required>
            <input type="password" name="password" placeholder="Contraseña" required>

            <button class="btn primary">Registrarse</button>
        </form>
        <p id="mensajeError" class="error"></p>

        <p class="link">
            ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
        </p>
    </div>

    <div class="image">
        <img src="imagenes/ilustracion VozSegura.png" alt="Ilustración">
    </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const error = params.get("error");

const msg = document.getElementById("mensajeError");

if(error === "nombre"){
    msg.innerText = "El nombre es obligatorio";
}

if(error === "usuario_vacio"){
    msg.innerText = "El usuario no puede estar vacío";
}

if(error === "usuario"){
    msg.innerText = "El usuario ya existe";
}

if(error === "correo"){
    msg.innerText = "El correo ya está registrado";
}

if(error === "correo_invalido"){
    msg.innerText = "El correo no es válido";
}

if(error === "clave_corta"){
    msg.innerText = "La contraseña debe tener al menos 6 caracteres";
}

if(error === "bd"){
    msg.innerText = "Error en el servidor";
}

if(error === "datos"){
    msg.innerText = "Faltan datos";
}

// limpiar URL
if(error){
    window.history.replaceState({}, document.title, window.location.pathname);
}
</script>
</body>
</html>
